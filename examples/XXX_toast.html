<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Shell</title>
</head>
<body style="box-sizing: content-box; margin-inline: auto; max-inline-size: 60vw; margin-top: 10vh;">
<article>
  <h1>Toast Component Demo</h1>
  <toast-demo></toast-demo>
</article>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<script src="./build/cami.cdn.js"></script>
<script type="module">
  const { html, ReactiveElement, model } = cami;
  cami.debug.enable();

  const ToastModel = model("ToastModel", {
    store: "toast-store",
    state: {
      toasts: []
    },
    actions: {
      addToast: ({ state, payload }) => {
        const id = Date.now();
        state.toasts.push({ ...payload, id });

        if (payload.duration !== Infinity) {
          setTimeout(() => ToastModel.dispatch('removeToast', id), payload.duration || 4000);
        }
      },
      removeToast: ({ state, payload: id }) => {
        state.toasts = state.toasts.filter(toast => toast.id !== id);
      }
    }
  });

  const toast = {
    message: (message, options = {}) => {
      ToastModel.dispatch('addToast', { message, type: 'default', ...options });
    },
    success: (message, options = {}) => {
      ToastModel.dispatch('addToast', { message, type: 'success', icon: '✅', ...options });
    },
    error: (message, options = {}) => {
      ToastModel.dispatch('addToast', { message, type: 'error', icon: '❌', ...options });
    },
    info: (message, options = {}) => {
      ToastModel.dispatch('addToast', { message, type: 'info', icon: 'ℹ️', ...options });
    },
    warning: (message, options = {}) => {
      ToastModel.dispatch('addToast', { message, type: 'warning', icon: '⚠️', ...options });
    },
  };

  class ToastDemoElement extends ReactiveElement {
    handleFormSubmit(e) {
      e.preventDefault();
      const message = this.querySelector('#toast-message').value;
      const type = this.querySelector('#toast-type').value;
      const duration = parseInt(this.querySelector('#toast-duration').value, 10);

      toast[type] ? toast[type](message, { duration: duration }) : toast.message(message, { type: type, duration: duration });

      e.target.reset();
    }

    template() {
      const { toasts } = ToastModel;

      return html`
        <div class="demo-buttons">
          <button @click=${() => toast.success('Success message')}>Success Toast</button>
          <button @click=${() => toast.error('Error message')}>Error Toast</button>
          <button @click=${() => toast.info('Info message')}>Info Toast</button>
          <button @click=${() => toast.warning('Warning message')}>Warning Toast</button>
        </div>

        <form @submit=${(e) => {
          e.preventDefault();
          const message = this.querySelector('#toast-message').value;
          const type = this.querySelector('#toast-type').value;
          const duration = parseInt(this.querySelector('#toast-duration').value, 10);

          toast[type] ? toast[type](message, { duration: duration }) : toast.message(message, { type: type, duration: duration });

          e.target.reset();
        }}>
          <label>
            Message:
            <input type="text" id="toast-message" required>
          </label>
          <label>
            Type:
            <select id="toast-type">
              <option value="default">Default</option>
              <option value="success">Success</option>
              <option value="error">Error</option>
              <option value="info">Info</option>
              <option value="warning">Warning</option>
            </select>
          </label>
          <label>
            Duration (ms):
            <input type="number" id="toast-duration" value="4000" min="1000" step="1000">
          </label>
          <button type="submit">Show Custom Toast</button>
        </form>

        <div id="toaster-container">
          <div class="toaster">
            ${toasts.map(toast => html`
              <div id="toast-${toast.id}" class="toast toast-enter" data-type="${toast.type}">
                <div class="toast-content">
                  ${toast.icon ? html`<div class="toast-icon">${toast.icon}</div>` : ''}
                  <div class="toast-message">${toast.message}</div>
                </div>
                <button class="toast-close" @click=${() => ToastModel.dispatch('removeToast', toast.id)}>×</button>
              </div>
            `)}
          </div>
        </div>
      `;
    }
  }

  customElements.define('toast-demo', ToastDemoElement);
</script>
<style>
  .toaster {
    background-color: white;
    padding: 10px;
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    z-index: 9999;
  }
  .toast {
    background-color: var(--card-background-color);
    border-radius: var(--border-radius);
    box-shadow: var(--card-box-shadow);
    margin-bottom: 10px;
    padding: var(--spacing);
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-width: 250px;
    max-width: 350px;
    transition: slideIn 150ms ease-out;
    opacity: 1;
    transform: translateX(0);
  }
  .toast-content {
    display: flex;
    align-items: center;
  }
  .toast-icon {
    margin-right: var(--spacing);
    font-size: 1.2em;
  }
  .toast-message {
    font-size: var(--font-size);
  }
  .toast-close {
    background: none;
    border: none;
    color: var(--muted-color);
    cursor: pointer;
    font-size: var(--font-size);
    margin-left: var(--spacing);
    padding: 0;
  }
  .toast[data-type="success"] {
    border-left: 4px solid var(--form-element-valid-border-color);
  }
  .toast[data-type="error"] {
    border-left: 4px solid var(--form-element-invalid-border-color);
  }
  .toast[data-type="info"] {
    border-left: 4px solid var(--primary);
  }
  .toast[data-type="warning"] {
    border-left: 4px solid var(--secondary);
  }
  @keyframes slideIn {
    from {
      transform: translateX(100%);
      opacity: 0;
    }
    to {
      transform: translateX(0);
      opacity: 1;
    }
  }
  @keyframes slideOut {
    from {
      transform: translateX(0);
      opacity: 1;
    }
    to {
      transform: translateX(100%);
      opacity: 0;
    }
  }
  .toast-enter {
    animation: slideIn 0.150s ease-out;
  }
  .toast-exit {
    animation: slideOut 0.150s ease-out;
  }
</style>
</body>
</html>

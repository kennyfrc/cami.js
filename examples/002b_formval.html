<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Shell</title>
</head>
<body style="box-sizing: content-box; margin-inline: auto; max-inline-size: 60vw; margin-top: 10vh;">
  <article>
  <h1>Registration Form</h1>
  <form-component></form-component>
</article>
<small>
<p>Try entering an email that is alqueryy taken, such as trevinowanda@example.net (mock email)</p>
</small>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<script src="./build/cami.cdn.js"></script>
<!-- CDN version below -->
<!-- <script src="https://unpkg.com/cami@latest/build/cami.cdn.js"></script> -->
<script type="module">
  const { html, ReactiveElement, model } = cami;
  cami.debug.enable();

  const SigninModel = model("SigninModel", {
    store: "form-store",
    state: {
      email: '',
      password: '',
      emailError: '',
      passwordError: '',
      emailIsValid: false,
      isEmailAvailable: false
    },
    actions: {
      setEmail: ({ state, payload }) => {
        const { email } = payload;
        state.email = email;
      },
      setPassword: ({ state, payload }) => {
        const { password } = payload;
        state.password = password;
      },
      setEmailError: ({ state, payload }) => {
        const { emailError } = payload;
        state.emailError = emailError;
      },
      setPasswordError: ({ state, payload }) => {
        const { passwordError } = payload;
        state.passwordError = passwordError;
      },
      setEmailIsValid: ({ state, payload }) => {
        const { isValid } = payload;
        state.emailIsValid = isValid;
      },
      setIsEmailAvailable: ({ state, payload }) => {
        const { isAvailable } = payload;
        state.isEmailAvailable = isAvailable;
      },
      processEmailInput: ({ dispatch, query, payload }) => {
        const { email } = payload;
        const { isEmailValid, emailError } = validateEmail(email);
        dispatch('setEmailError', { emailError });
        dispatch('setEmailIsValid', { isValid: isEmailValid });
        dispatch('setEmail', { email });
        query('fetchEmail', { email });
      },
      processPasswordInput: ({ dispatch, payload }) => {
        const { password } = payload;
        const { isValid } = validatePassword(password);
        dispatch('setPasswordError', { passwordError: isValid ? '' : 'Password must be at least 8 characters long.' });
        dispatch('setPassword', { password });
      }
    },
    queries: {
      fetchEmail: {
        queryKey: (payload) => {
          const { email } = payload;
          return ['Email', email];
        },
        queryFn: (payload) => {
          const { email } = payload;
          return fetch(`https://api.camijs.com/users?email=${email}`).then(res => res.json());
        },
        onSuccess: ({ dispatch, data }) => {
          dispatch('setIsEmailAvailable', { isAvailable: data.length === 0 });
        },
        staleTime: 1000 * 60 * 5
      }
    }
  });

  function validateEmail(email) {
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    let emailError = '';
    let isEmailValid = null;
    if (email === '') {
      emailError = '';
      isEmailValid = null;
    } else if (!emailRegex.test(email)) {
      emailError = 'Please enter a valid email address.';
      isEmailValid = false;
    } else {
      emailError = '';
      isEmailValid = true;
    }
    return { isEmailValid, emailError };
  }

  function validatePassword(password) {
    let isValid = false;
    if (password === '') {
      isValid = null;
    } else if (password?.length >= 8) {
      isValid = true;
    }
    return { isValid };
  }

  class FormElement extends ReactiveElement {
    template() {
      const { email, password, emailError, passwordError, emailIsValid, isEmailAvailable, dispatch } = SigninModel;

      const getEmailInputState = () => {
        if (email === '') {
          return '';
        }

        const isValidAndAvailable = emailIsValid && isEmailAvailable === true;
        return isValidAndAvailable ? false : true;
      };

      const getPasswordInputState = () => {
        if (password === '') {
          return '';
        }

        const isPasswordValid = passwordError === '';
        return isPasswordValid ? false : true;
      };

      return html`
        <form action="/submit" method="POST">
          <label>
            Email:
            <input type="email"
              aria-invalid=${getEmailInputState()}
              @input=${(e) => dispatch('processEmailInput', { email: e.target.value })}
              value=${email}>
            <span>${isEmailAvailable === false && emailError === '' ? 'Email is already taken.' : ''}</span>
            <span>${emailError}</span>
          </label>
          <label>
            Password:
            <input type="password"
              @input=${(e) => dispatch('processPasswordInput', { password: e.target.value })}
              value=${password}
              aria-invalid=${getPasswordInputState()}>
            <span>${passwordError}</span>
          </label>
          <input type="submit" value="Submit" style="opacity: ${emailError !== '' || passwordError !== '' || email === '' || password === '' ? '0.5' : '1'}">
        </form>
      `;
    }
  }

  customElements.define('form-component', FormElement);
</script>

</body>
</html>

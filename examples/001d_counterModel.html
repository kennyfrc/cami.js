<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Shell</title>
</head>
<body style="box-sizing: content-box; margin-inline: auto; max-inline-size: 60vw; margin-top: 10vh;">
<article>
  <h1>Counter Example</h1>
  <counter-component></counter-component>
</article>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
/>
<script src="./build/cami.cdn.js"></script>
<script type="module">
  const { html, ReactiveElement, Type } = cami;

  const Counter = Type.Model("CounterModel", {
    count: Type.Integer,
  });

  const counter = Counter.create({
    state: { count: 0 },
    actions: {
      increment: ({ state }) => {
        state.count += 1;
      },
      decrement: ({ state }) => {
        state.count -= 1;
      },
    },
  });

  class CounterElement extends ReactiveElement {
    template() {
      return html`
        <div>
          <button @click=${() => counter.dispatch("decrement")}>-</button>
          <button @click=${() => counter.dispatch("increment")}>+</button>
          <div>Count: ${counter.count}</div>
        </div>
      `;
    }
  }

  customElements.define("counter-component", CounterElement);
</script>
</body>
</html>

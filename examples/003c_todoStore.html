<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application Shell</title>
  </head>
  <body
    style="
      box-sizing: content-box;
      margin-inline: auto;
      max-inline-size: 60vw;
      margin-top: 10vh;
    "
  >
<article>
  <h1>Todo List</h1>
  <p><small class="note"></small></p>
  <todo-list-component></todo-list-component>
</article>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
/>
<script src="./build/cami.cdn.js"></script>
<script type="module">
  const { html, ReactiveElement, store } = cami;
  cami.debug.enable();

  const todoStore = store({
    state: {
      newTodoTitle: "",
      todos: {
        data: [],
        status: "idle",
        error: null,
      },
    },
    name: "todo-store",
  });

  todoStore.defineAction("setTodos", ({ state, payload }) => {
    state.todos = payload;
  });

  todoStore.defineAction("addTodo", ({ state, payload }) => {
    state.todos.data.push(payload);
  });

  todoStore.defineAction("removeTodo", ({ state, payload }) => {
    state.todos.data = state.todos.data.filter(
      (todo) => todo.title !== payload.title
    );
  });

  todoStore.defineAction("setNewTodoTitle", ({ state, payload }) => {
    state.newTodoTitle = payload;
  });

  todoStore.defineQuery("fetchTodos", {
    queryKey: ["todos"],
    queryFn: () =>
      fetch("https://api.camijs.com/todos?_limit=5").then((res) => {
        if (res.ok) {
          return res.json();
        }
        throw new Error("Failed to fetch todos");
      }),
    staleTime: 1000 * 60 * 5,
    onFetch: ({ dispatch }) => {
      dispatch("setTodos", {
        data: [],
        status: "pending",
        error: null,
      });
    },
    onSuccess: ({ dispatch, data }) => {
      dispatch("setTodos", {
        data: data,
        status: "success",
        error: null,
      });
    },
    onError: ({ dispatch, error }) => {
      dispatch("setTodos", {
        data: [],
        status: "error",
        error: error,
      });
    },
  });

  todoStore.defineMutation("createTodo", {
    mutationFn: (newTodo) => {
      return fetch("https://api.camijs.com/todos", {
        method: "POST",
        body: JSON.stringify(newTodo),
        headers: {
          "Content-type": "application/json; charset=UTF-8",
        },
      }).then((res) => {
        document.querySelector(".note").innerHTML =
          "Todo added optimistically. Note that since we're using a mock server, this doesn't modify anything in the DB.";
        return res.json();
      });
    },
    onMutate: ({ dispatch, payload }) => {
      const newTodo = {
        id: Date.now(),
        title: payload.title,
        completed: payload.completed,
      };
      dispatch("addTodo", newTodo);
    },
    onSuccess: ({ invalidateQueries }) => {
      invalidateQueries({ queryKey: ["todos"] });
    },
  });

  todoStore.defineMutation("deleteTodo", {
    mutationFn: (todo) => {
      return fetch(`https://api.camijs.com/todos/${todo.id}`, {
        method: "DELETE",
      }).then((res) => {
        document.querySelector(".note").innerHTML =
          "Todo deleted optimistically. Note that since we're using a mock server, this doesn't modify anything in the DB.";
        return res.json();
      });
    },
    onMutate: ({ dispatch, payload }) => {
      dispatch("removeTodo", payload);
    },
    onSuccess: ({ invalidateQueries }) => {
      invalidateQueries({ queryKey: ["todos"] });
    },
  });

  todoStore.defineMemo("reversedTodos", ({ state }) =>
    state.todos.data.slice().reverse()
  );

  customElements.define(
    "todo-list-component",
    class extends ReactiveElement {
      template() {
        const { todos, newTodoTitle } = todoStore.state;
        const { mutate, dispatch } = todoStore;
        const reversedTodos = todoStore.memo("reversedTodos");

        if (todos.status === "success") {
          return html`
            <input
              type="text"
              .value=${newTodoTitle}
              @input=${(e) => dispatch("setNewTodoTitle", e.target.value)}
            />
            <button
              @click=${() => {
                if (newTodoTitle.trim()) {
                  mutate("createTodo", {
                    title: newTodoTitle.trim(),
                    completed: false,
                  });
                  dispatch("setNewTodoTitle", "");
                }
              }}
            >
              Add
            </button>
            <ul>
              ${reversedTodos.map(
                (todo) => html`
                  <li>
                    ${todo.title}
                    <button @click=${() => mutate("deleteTodo", todo)}>
                      Delete
                    </button>
                  </li>
                `
              )}
            </ul>
          `;
        }

        if (todos.status === "pending") {
          return html`<div>Loading...</div>`;
        }

        if (todos.status === "error") {
          return html`<div>Error: ${todos.error.message}</div>`;
        }
      }
    }
  );

  todoStore.query("fetchTodos");
</script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application Shell</title>
  </head>
  <body
    style="
      box-sizing: content-box;
      margin-inline: auto;
      max-inline-size: 60vw;
      margin-top: 10vh;
    "
  >
<article>
  <h1>Event Testing Component</h1>
  <event-testing-component></event-testing-component>
</article>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
/>
<script src="./build/cami.cdn.js"></script>
<script type="module">
  const { html, defineReactiveElement, store } = cami;
  cami.debug.enable();

  const eventTestingStore = store({
    state: {
      count: 0,
      lastEvent: null,
      mousePosition: { x: 0, y: 0 },
      dragPosition: { x: 0, y: 0 },
      resizeSize: { width: 200, height: 100 },
      keyPressed: null,
      keyPressBuffer: [],
    },
    name: "event-testing-store",
  });

  eventTestingStore.defineAction("increment", ({ state }) => (state.count += 1));
  eventTestingStore.defineAction("decrement", ({ state }) => (state.count -= 1));
  eventTestingStore.defineAction("setLastEvent", ({ state, payload} ) => (state.lastEvent = payload));
  eventTestingStore.defineAction("setMousePosition", ({ state, payload }) => (state.mousePosition = payload));
  eventTestingStore.defineAction("setDragPosition", ({ state, payload } ) => (state.dragPosition = payload));
  eventTestingStore.defineAction("setResizeSize", ({ state, payload }) => (state.resizeSize = payload));
  eventTestingStore.defineAction("setKeyPressed", ({ state, payload }) => (state.keyPressed = payload));
  eventTestingStore.defineAction("setKeyPressBuffer", ({ state, payload }) => (state.keyPressBuffer = payload));

  const uuid = crypto.randomUUID();
  const incrementId = `${uuid}-increment`;
  const decrementId = `${uuid}-decrement`;
  const dragAreaId = `${uuid}-drag-area`;
  const resizeAreaId = `${uuid}-resize-area`;

  defineReactiveElement("event-testing-component", eventTestingStore, ({ store, ctx }) => {
    const { count, lastEvent, mousePosition, dragPosition, resizeSize, keyPressed, keyPressBuffer, inputValue } = store.getState();

    // Handle click events
    if (ctx.clicked.owner === incrementId) {
      store.dispatch("increment");
    }
    if (ctx.clicked.owner === decrementId) {
      store.dispatch("decrement");
    }
    if (ctx.clicked.owner === `${uuid}-clear-input`) {
      store.dispatch("setInputValue", "");
      document.querySelector(`[node-id="${uuid}-text-input"]`).value = "";
    }

    // Handle key events
    if (ctx.keyPressed.key) {
      store.dispatch("setKeyPressed", ctx.keyPressed.key);
    }
    if (ctx.keyPressBuffer.length > 0) {
      store.dispatch("setKeyPressBuffer", ctx.keyPressBuffer);
    }

    // Handle input events
    console.log(ctx.input)
    if (ctx.input.owner == `${uuid}-clear-input`) {
      store.dispatch("setInputValue", ctx.input.value)
    }

    // Update last event
    if (ctx.event) {
      store.dispatch("setLastEvent", {
        type: ctx.event.type,
        target: ctx.event.target.getAttribute('node-id') || 'unknown',
      });
    }

    return html`
      <div>
        <h2>Counter</h2>
        <button node-id=${decrementId}>-</button>
        <button node-id=${incrementId}>+</button>
        <div>Count: ${count}</div>
      </div>

      <div>
        <h2>Mouse Position</h2>
        <div>X: ${mousePosition.x}, Y: ${mousePosition.y}</div>
      </div>

      <div>
        <h2>Drag Area</h2>
        <div
          node-id=${dragAreaId}
          style="width: 100px; height: 100px; background-color: lightblue; position: absolute; left: ${dragPosition.x}px; top: ${dragPosition.y}px; cursor: move;"
        >
          Drag me
        </div>
      </div>

      <div>
        <h2>Resize Area</h2>
        <div
          node-id=${resizeAreaId}
          style="width: ${resizeSize.width}px; height: ${resizeSize.height}px; background-color: lightgreen; resize: both; overflow: auto;"
        >
          Resize me
        </div>
      </div>

      <div>
        <h2>Keyboard Events</h2>
        <div>Last Key Pressed: ${keyPressed}</div>
        <div>Key Press Buffer: ${keyPressBuffer.join(', ')}</div>
      </div>

      <div>
        <h2>Text Field Events</h2>
        <input type="text" node-id="${uuid}-text-input" placeholder="Type here...">
        <button node-id="${uuid}-clear-input">Clear Input</button>
        <div>Input Value: ${store.getState().inputValue || ''}</div>
      </div>

      <div>
        <h2>Last Event</h2>
        <div>Type: ${lastEvent ? lastEvent.type : 'None'}</div>
        <div>Target: ${lastEvent ? lastEvent.target : 'None'}</div>
      </div>
    `;
  });

  // Add a new action to the store
  eventTestingStore.defineAction("setInputValue", ({ state, payload }) => (state.inputValue = payload));

  // Add an event listener for the input element
  document.addEventListener('input', (event) => {
    if (event.target.getAttribute('node-id') === `${uuid}-text-input`) {
      eventTestingStore.dispatch("setInputValue", event.target.value);
    }
  });
</script>
  </body>
</html>

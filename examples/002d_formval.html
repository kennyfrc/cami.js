<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Shell</title>
</head>
<body style="box-sizing: content-box; margin-inline: auto; max-inline-size: 60vw; margin-top: 10vh;">
<article>
  <h1>Registration Form</h1>
  <form-component></form-component>
</article>
<small>
  <p>
    Try entering an email that is already taken, such as
    trevinowanda@example.net (mock email)
  </p>
</small>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
/>
<script src="./build/cami.cdn.js"></script>
<script type="module">
  const { html, ReactiveElement, Type } = cami;

  const FormModel = Type.Model("FormModel", {
    email: Type.String,
    password: Type.String,
    emailError: Type.String,
    passwordError: Type.String,
    emailIsValid: Type.Boolean,
    isEmailAvailable: Type.Boolean,
  });

  const form = FormModel.create({
    state: {
      email: "",
      password: "",
      emailError: "",
      passwordError: "",
      emailIsValid: false,
      isEmailAvailable: false,
    },
    actions: {
      setEmail: ({ state, payload }) => {
        state.email = payload;
      },
      setPassword: ({ state, payload }) => {
        state.password = payload;
      },
      setIsEmailAvailable: ({ state, payload }) => {
        state.isEmailAvailable = payload;
      },
      processEmailInput: ({ state, payload, query }) => {
        state.email = payload;
        query("fetchEmail", payload);
      },
      processPasswordInput: ({ state, payload }) => {
        state.password = payload;
      },
    },
    queries: {
      fetchEmail: {
        queryKey: (email) => ["Email", email],
        queryFn: (email) => {
          return fetch(`https://api.camijs.com/users?email=${email}`).then(
            (res) => res.json()
          );
        },
        onSuccess: ({ state, payload, dispatch, data }) => {
          dispatch("setIsEmailAvailable", data.length === 0);
        },
        staleTime: 1000 * 60 * 5,
      },
    },
    memos: {
      validateEmail: ({ state }) => {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const isEmailValid = state.email !== "" && emailRegex.test(state.email);
        const emailError = isEmailValid
          ? ""
          : "Please enter a valid email address.";
        return { isEmailValid, emailError };
      },
      validatePassword: ({ state }) => {
        const isPasswordValid = state.password.length >= 8;
        const passwordError = isPasswordValid
          ? ""
          : "Password must be at least 8 characters long.";
        return { isPasswordValid, passwordError };
      },
      getEmailInputState: ({ state, memo }) => {
        const { isEmailValid } = memo("validateEmail");
        if (state.email === "") return "";
        return !(isEmailValid && state.isEmailAvailable);
      },
      getPasswordInputState: ({ state, memo }) => {
        const { isPasswordValid } = memo("validatePassword");
        if (state.password === "") return "";
        return !isPasswordValid;
      },
      isSubmitDisabled: ({ state, memo }) => {
        const { isEmailValid } = memo("validateEmail");
        const { isPasswordValid } = memo("validatePassword");
        return !(isEmailValid && isPasswordValid && state.isEmailAvailable);
      },
    },
  });

  customElements.define(
    "form-component",
    class extends ReactiveElement {
      template() {
        const { emailError } = form.memo("validateEmail");
        const { passwordError } = form.memo("validatePassword");

        return html`
          <form action="/submit" method="POST">
            <label>
              Email:
              <input
                type="email"
                aria-invalid=${form.memo("getEmailInputState")}
                @input=${(e) =>
                  form.dispatch("processEmailInput", e.target.value)}
                value=${form.email}
              />
              <span>
                ${form.isEmailAvailable === false && emailError === ""
                  ? "Email is already taken."
                  : emailError}
              </span>
            </label>
            <label>
              Password:
              <input
                type="password"
                @input=${(e) =>
                  form.dispatch("processPasswordInput", e.target.value)}
                value=${form.password}
                aria-invalid=${form.memo("getPasswordInputState")}
              />
              <span>${passwordError}</span>
            </label>
            <input
              type="submit"
              value="Submit"
              style="opacity: ${form.memo("isSubmitDisabled") ? "0.5" : "1"}"
            />
          </form>
        `;
      }
    }
  );
</script>
</body>
</html>

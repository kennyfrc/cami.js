<main class="container">
  <h1>Store with Effect</h1>
  <div id="app"></div>
</main>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
<script src="./build/cami.cdn.js"></script>
<script type="module">
  const { store, effect, ObservableState } = cami;

  const appStore = store({ count: 1, posts: [] });

  appStore.action('double', ({ state }) => {
    state.count *= 2;
  });

  appStore.action('setPosts', ({ state, payload }) => {
    state.posts = payload;
  });

  appStore.action('addPost', ({ state, payload }) => {
    state.posts = [...state.posts, payload];
  });

  // appStore.query('fetchPosts', {

  //   }
  // });

  appStore.mutation('createPost', {
    mutationFn: (newPost) => fetch('https://jsonplaceholder.typicode.com/posts', {
      method: 'POST',
      body: JSON.stringify(newPost),
      headers: { 'Content-type': 'application/json; charset=UTF-8' }
    }).then(res => res.json()),
    onSuccess: (ctx) => {
      ctx.actions.addPost(ctx.result);
      console.log(ctx.result)
    },
    onSettled: (ctx) => {
      // console.log(ctx.state);
    }
  });

  effect(() => {
    console.log('Count store changed:', appStore.state.count);
  });

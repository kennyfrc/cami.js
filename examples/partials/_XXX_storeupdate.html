<main class="container">
  <h1>Navigation State Machine</h1>
  <div id="app">
    <button id="toggleNav">Toggle Navigation</button>
    <p>Current Navigation Status: <span id="navStatus"></span></p>
  </div>
</main>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
<script src="./build/cami.cdn.js"></script>
<script type="module">
  const { store, effect } = cami;
  cami.debug.enable()

  const appStore = store({
    navigation: {
      status: 'menu'
    }
  });

  appStore.action('NAV_FSM:TOGGLE', ({ state }) => {
    const transitions = {
      'menu': 'settings',
      'settings': 'profile',
      'profile': 'menu'
    };

    console.log(state.navigation.status);

    state.navigation.status = transitions[state.navigation.status];
  });

  effect(() => {
    console.log('Navigation status changed:', appStore.state.navigation.status);
    document.getElementById('navStatus').textContent = appStore.state.navigation.status;
  });

  document.getElementById('toggleNav').addEventListener('click', () => {
    appStore.dispatch('NAV_FSM:TOGGLE');
  });

  // Attempt to trigger the bug by rapidly changing the navigation status
  setInterval(() => {
    appStore.dispatch('NAV_FSM:TOGGLE');
  }, 1000);
</script>

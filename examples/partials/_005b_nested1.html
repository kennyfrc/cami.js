<article>
  <h1>Label Updates from Input Forms (Nested Observable)</h1>
  <simple-input-component></simple-input-component>
</article>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<script src="./build/cami.cdn.js"></script>
<!-- CDN version below -->
<!-- <script src="https://unpkg.com/cami@latest/build/cami.cdn.js"></script> -->
<script type="module">
  const { html, ReactiveElement, model } = cami;

  const UserFormModel = model("UserFormModel", {
    store: "user-form-store",
    state: {
      user: { name: 'Kenn', age: 34, email: 'kenn@example.com' }
    },
    actions: {
      updateUser: ({ state, payload }) => {
        // transforms data model
        const transforms = {
          name: (value) => value.trim(),
          age: (value) => parseInt(value),
          email: (value) => value.trim().toLowerCase()
        };

        // apply transforms to payload
        let _payload = {};
        Object.keys(payload).forEach(key => {
          const transform = transforms[key];
          if (transform) {
            _payload[key] = transform(payload[key]);
          }
        });
        state.user = { ...state.user, ..._payload };
      },
      resetUser: ({ state }) => {
        state.user = { name: 'Kenn', age: 34, email: 'kenn@example.com' };
      }
    }
  });

  class UserFormElement extends ReactiveElement {
    onCreate() {
      this.model = UserFormModel;
    }

    handleInput(event, key) {
      this.model.updateUser({ [key]: event.target.value });
    }

    resetForm() {
      this.model.resetUser();
    }

    template() {
      return html`
        <form>
          <label>
            Name: ${this.model.user.name}
            <input type="text" .value=${this.model.user.name} @input=${(e) => this.handleInput(e, 'name')} />
          </label>
          <label>
            Age: ${this.model.user.age}
            <input type="number" .value=${this.model.user.age} @input=${(e) => this.handleInput(e, 'age')} />
          </label>
          <label>
            Email: ${this.model.user.email}
            <input type="email" .value=${this.model.user.email} @input=${(e) => this.handleInput(e, 'email')} />
          </label>
          <button type="button" @click=${this.resetForm.bind(this)}>Reset</button>
        </form>
      `;
    }
  }

  customElements.define('simple-input-component', UserFormElement);
</script>

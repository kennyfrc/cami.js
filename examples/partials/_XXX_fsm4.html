<article>
  <h1>Interactive Button State Machine</h1>
  <button-component></button-component>
</article>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
/>
<script src="./build/cami.cdn.js"></script>
<script type="module">
  const { html, ReactiveElement, store } = cami;
  cami.debug.enable();

  const buttonStore = store({
    state: {
      status: "unlocked",
      interaction: "default",
    },
    name: "button-store",
  });

  buttonStore.defineMachine("button", {
    mouse_enter: {
      from: [
        { status: "unlocked", interaction: "default" },
        { status: "locked", interaction: "default" },
      ],
      to: ({ state }) => ({
        status: state.status,
        interaction: state.status === "unlocked" ? "hovered" : "locked_hovered",
      }),
    },
    mouse_leave: {
      from: [
        { status: "unlocked", interaction: "hovered" },
        { status: "unlocked", interaction: "pressed" },
        { status: "locked", interaction: "locked_hovered" },
        { status: "locked", interaction: "locked_pressed" },
      ],
      to: ({ state }) => ({
        status: state.status,
        interaction: "default",
      }),
    },
    mouse_down: {
      from: [
        { status: "unlocked", interaction: "hovered" },
        { status: "locked", interaction: "locked_hovered" },
      ],
      to: ({ state }) => ({
        status: state.status,
        interaction: state.status === "unlocked" ? "pressed" : "locked_pressed",
      }),
    },
    mouse_up: {
      from: [
        { status: "unlocked", interaction: "pressed" },
        { status: "locked", interaction: "locked_pressed" },
      ],
      to: ({ state }) => ({
        status: state.status === "unlocked" ? "locked" : "unlocked",
        interaction: state.status === "unlocked" ? "locked_hovered" : "hovered",
      }),
    },
  });

  customElements.define(
    "button-component",
    class extends ReactiveElement {
      template() {
        const { status, interaction } = buttonStore.state;
        const { trigger } = buttonStore;

        return html`
          <style>
            .button {
              padding: 10px 20px;
              font-size: 16px;
              border-radius: 5px;
              cursor: pointer;
              transition: transform 0.2s ease-out;
              border: 2px solid transparent;
            }
            .unlocked {
              background-color: green;
              color: white;
              border-color: darkgreen;
            }
            .locked {
              background-color: red;
              color: white;
              border-color: darkred;
            }
            .hovered,
            .locked_hovered {
              transform: scale(1.05);
              box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            }
            .pressed,
            .locked_pressed {
              transform: scale(0.95);
              box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2);
            }
          </style>
          <button
            class="button ${status} ${interaction}"
            @mouseenter=${() => trigger("button:mouse_enter")}
            @mouseleave=${() => trigger("button:mouse_leave")}
            @mousedown=${() => trigger("button:mouse_down")}
            @mouseup=${() => trigger("button:mouse_up")}
          >
            ${status === "unlocked" ? "Lock" : "Unlock"} (${interaction})
          </button>
        `;
      }
    }
  );
</script>

<article>
  <h1>Post List</h1>
  <post-list-component></post-list-component>
</article>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
<script src="./build/cami.cdn.js"></script>
<script type="module">
  const { html, ReactiveElement, store, slice } = cami;
  cami.debug.enable();

  const appStore = store({
    // Initial state for other parts of the application
  });

  const postsSlice = slice(appStore, {
    name: 'posts',
    state: [
      { id: 1, title: 'First Post' },
      { id: 2, title: 'Second Post' }
    ],
    actions: {
      updatePost: (state, { id, title }) => {
        const postIndex = state.findIndex(post => post.id === id);
        if (postIndex !== -1) {
          state[postIndex].title = title;
        }
      }
    }
  });

  // appStore.reset();

  class PostListElement extends ReactiveElement {
    onCreate() {
      this.posts = postsSlice.getState();
    }

    onConnect() {
      postsSlice.subscribe(state => {
        this.posts = state;
      });
    }

    updatePost(id, title) {
      postsSlice.actions.updatePost({ id, title });
    }

    template() {
      return html`
        <ul>
          ${this.posts.map(post => html`
            <li>
              ${post.title}
              <button @click=${() => this.updatePost(post.id, 'Updated Title')}>Update</button>
            </li>
          `)}
        </ul>
      `;
    }
  }

  customElements.define('post-list-component', PostListElement);
</script>

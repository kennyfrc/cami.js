<article>
  <h1>Active Conversations</h1>
  <conversation-list></conversation-list>
</article>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
/>
<script src="./build/cami.cdn.js"></script>
<script type="module">
  const { html, defineReactiveElement, store } = cami;
  cami.debug.enable();

  const conversationStore = store({
    state: {
      conversations: [],
      documents: []
    },
    name: "conversation-store"
  });

  // Define actions
  conversationStore.defineAction("toggleMenuOpen", ({ state, payload }) => {
    const { conversationId } = payload;
    const conversation = state.conversations.find(c => c.id === conversationId);
    if (conversation) {
      conversation.isMenuOpen = !conversation.isMenuOpen;
    }
  });

  conversationStore.defineAction("initialize", ({ state, payload }) => {
    state.conversations = payload.conversations;
    state.documents = payload.documents;
  });

  // Define memo for activeConversations
  conversationStore.defineMemo("activeConversations", ({ state }) => {
    return state.conversations.filter(conversation => 
      state.documents.some(doc => doc.id === conversation.docId && doc.isOpen)
    );
  });

  defineReactiveElement("conversation-button", conversationStore, ({ store, ctx, element }) => {
    const conversationId = Number(element.getAttribute('conversation-id'));
    const conversation = store.getState().conversations.find(c => c.id === conversationId);

    if (ctx.clicked.owner === element.id) {
      store.dispatch("toggleMenuOpen", { conversationId });
    }

    return html`
      ${conversation.isMenuOpen ? 'Close Menu' : 'Open Menu'}
    `;
  });

  defineReactiveElement("conversation-list", conversationStore, ({ store }) => {
    const activeConversations = store.memo("activeConversations");

    return html`
      <ul>
        ${activeConversations.map(conversation => html`
          <li>
            ${conversation.title}
            <conversation-button 
              conversation-id="${conversation.id}"
              id="toggle-menu-${conversation.id}"
              node-id="toggle-menu-${conversation.id}"
            ></conversation-button>
            ${conversation.isMenuOpen ? html`
              <div class="menu">
                <!-- Menu content -->
                <p>Menu for ${conversation.title}</p>
              </div>
            ` : ''}
          </li>
        `)}
      </ul>
    `;
  });

  // Initialize some data
  conversationStore.dispatch("initialize", {
    conversations: [
      { id: 1, title: "Conversation 1", docId: "doc1", isMenuOpen: false },
      { id: 2, title: "Conversation 2", docId: "doc2", isMenuOpen: false },
      { id: 3, title: "Conversation 3", docId: "doc3", isMenuOpen: false },
    ],
    documents: [
      { id: "doc1", isOpen: true },
      { id: "doc2", isOpen: false },
      { id: "doc3", isOpen: true },
    ]
  });
</script>

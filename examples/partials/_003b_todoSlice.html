<article>
  <h1>Todo List</h1>
  <p><small class="note"></small></p>
  <todo-list-component></todo-list-component>
</article>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<script src="./build/cami.cdn.js"></script>
<!-- CDN version below -->
<!-- <script src="https://unpkg.com/cami@latest/build/cami.cdn.js"></script> -->
<script type="module">
  const { html, ReactiveElement, slice } = cami;
  cami.debug.enable()

  const todoSlice = slice("todoSlice", {
    store: "todo-store",
    state: {
      newTodoTitle: '',
      todos: {
        data: [],
        status: "idle",
        error: null
      }
    },
    actions: {
      setTodos: ({ state, payload }) => {
        state.todos = {
          data: payload.data,
          status: payload.status,
          error: payload.error
        }
      },
      addTodo: ({ state, payload }) => {
        state.todos.data.push(payload);
      },
      removeTodo: ({ state, payload }) => {
        state.todos.data = state.todos.data.filter(todo => todo.title !== payload.title);
      }
    },
    queries: {
      fetchTodos: {
        queryKey: ['todos'],
        queryFn: () => {
          return fetch("https://api.camijs.com/todos?_limit=5").then(res => res.json())
        },
        staleTime: 1000 * 60 * 5,
        onFetch: ({ actions }) => {
          actions.setTodos({
            data: [],
            status: "pending",
            error: null
          })
        },
        onSuccess: ({ response, actions }) => {
          actions.setTodos({
            data: response,
            status: "success",
            error: null
          })
        },
        onError: ({ error, actions }) => {
          actions.setTodos({
            data: [],
            status: "error",
            error: error
          })
        }
      }
    },
    mutations: {
      createTodo: {
        mutationFn: (newTodo) => {
          return fetch("https://api.camijs.com/todos", {
            method: "POST",
            body: JSON.stringify(newTodo),
            headers: {
              "Content-type": "application/json; charset=UTF-8"
            }
          }).then(res => {
            document.querySelector('.note').innerHTML = "Todo added optimistically. Note that since we're using a mock server, this doesn't modify anything in the DB."
            return res.json();
          })
        },
        onMutate: ({ actions, payload }) => {
          const newTodo = {
            id: Date.now(),
            title: payload.title,
            completed: payload.completed
          }
          actions.addTodo(newTodo);
        },
        onSuccess: ({ invalidateQueries }) => {
          invalidateQueries({ queryKey: ['todos'] });
        }
      },
      deleteTodo: {
        mutationFn: (todo) => {
          return fetch(`https://api.camijs.com/todos/${todo.id}`, {
            method: "DELETE"
          }).then(res => {
            document.querySelector('.note').innerHTML = "Todo deleted optimistically. Note that since we're using a mock server, this doesn't modify anything in the DB.";
            return res.json();
          })
        },
        onMutate: ({ actions, payload }) => {
          actions.removeTodo(payload);
        },
        onSuccess: ({ invalidateQueries }) => {
          invalidateQueries({ queryKey: ['todos'] });
        }
      }
    }
  });

  class TodoListElement extends ReactiveElement {
    onCreate() {
      this.model = todoSlice;
      this.newTodoTitle = '';
    }

    template() {
      if (this.model.todos.status === "success") {
        return html`
          <input
            type="text"
            .value=${this.newTodoTitle}
            @input=${(e) => this.newTodoTitle = e.target.value}
          />
          <button @click=${() => {
            if (this.newTodoTitle.trim()) {
              this.model.createTodo({
                title: this.newTodoTitle.trim(),
                completed: false
              });
              this.newTodoTitle = ''; // Clear the input after adding
            }
          }}>Add</button>
          <ul>
            ${this.model.todos.data.slice().reverse().map(todo => html`
              <li>
                ${todo.title}
                <button @click=${() => this.model.deleteTodo(todo)}>Delete</button>
              </li>
            `)}
          </ul>
        `;
      }

      if (this.model.todos.status === "pending") {
        return html`<div>Loading...</div>`;
      }

      if (this.model.todos.status === "error") {
        return html`<div>Error: ${this.model.todos.error.message}</div>`;
      }
    }
  }

  todoSlice.fetchTodos(); // usually done in some bootstrap function

  customElements.define('todo-list-component', TodoListElement);
</script>

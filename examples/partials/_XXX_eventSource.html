<article>
  <h1>User Profile Streamer</h1>
  <user-profile-component></user-profile-component>
</article>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<script src="./build/cami.cdn.js"></script>
<script type="module">
  const { html, ReactiveElement, store } = cami;
  cami.debug.enable();

  const userStore = store({
    state: {
      user: null,
      posts: [],
      latestPostComments: [],
      loading: false,
      error: null
    },
    name: "user-store"
  });

  // Action definitions remain the same
  userStore.defineAction('setUser', ({ state, payload }) => {
    state.user = payload;
  });

  userStore.defineAction('setPosts', ({ state, payload }) => {
    state.posts = payload;
  });

  userStore.defineAction('setLatestPostComments', ({ state, payload }) => {
    state.latestPostComments = payload;
  });

  userStore.defineAction('setLoading', ({ state, payload }) => {
    state.loading = payload;
  });

  userStore.defineAction('setError', ({ state, payload }) => {
    state.error = payload;
  });

  // Mock EventSource
  class MockEventSource {
    constructor(url) {
      this.url = url;
      this.onmessage = null;
      this.onerror = null;
      this.mockData = {
        user: { id: 1, name: 'John Doe', email: 'john@example.com', company: { name: 'ABC Corp' } },
        posts: [
          { id: 1, title: 'First post' },
          { id: 2, title: 'Second post' }
        ],
        comments: [
          { id: 1, body: 'Great post!' },
          { id: 2, body: 'Interesting read.' }
        ]
      };
    }

    start() {
      setTimeout(() => this.emitUser(), 1000);
      setTimeout(() => this.emitPosts(), 2000);
      setTimeout(() => this.emitComments(), 3000);
    }

    emitUser() {
      if (this.onmessage) {
        this.onmessage({ data: JSON.stringify({ type: 'user', data: this.mockData.user }) });
      }
    }

    emitPosts() {
      if (this.onmessage) {
        this.onmessage({ data: JSON.stringify({ type: 'posts', data: this.mockData.posts }) });
      }
    }

    emitComments() {
      if (this.onmessage) {
        this.onmessage({ data: JSON.stringify({ type: 'comments', data: this.mockData.comments }) });
      }
    }

    close() {
      // Cleanup if needed
    }
  }

  // Define the streamUserProfile thunk
  userStore.defineThunk('streamUserProfile', async ({ dispatch }) => {
    dispatch('setLoading', true);
    dispatch('setError', null);

    return new Promise((resolve, reject) => {
      const eventSource = new MockEventSource('/stream-user-profile');

      eventSource.onmessage = (event) => {
        const { type, data } = JSON.parse(event.data);
        switch (type) {
          case 'user':
            dispatch('setUser', data);
            break;
          case 'posts':
            dispatch('setPosts', data);
            break;
          case 'comments':
            dispatch('setLatestPostComments', data);
            break;
        }
      };

      eventSource.onerror = (error) => {
        dispatch('setError', 'Error streaming data');
        eventSource.close();
        reject(error);
      };

      eventSource.start(); // Start emitting mock events

      // Resolve after all mock data has been emitted
      setTimeout(() => {
        eventSource.close();
        dispatch('setLoading', false);
        resolve(userStore.state);
      }, 4000);
    });
  });

  customElements.define('user-profile-component',
    class extends ReactiveElement {
      template() {
        const { user, posts, latestPostComments, loading, error } = userStore.state;
        const { dispatchAsync } = userStore;

        const handleStream = () => {
          dispatchAsync('streamUserProfile')
            .then(result => {
              console.log('Streamed user profile:', result);
            })
            .catch(error => {
              console.error('Error in component:', error);
            });
        };

        return html`
          <button @click=${handleStream} ?disabled=${loading}>
            ${loading ? 'Streaming...' : 'Stream User Profile'}
          </button>
          ${error ? html`<p style="color: red;">${error}</p>` : ''}
          ${user ? html`
            <h2>${user.name}</h2>
            <p>Email: ${user.email}</p>
            <p>Company: ${user.company.name}</p>
            <h3>Posts: ${posts.length}</h3>
            ${posts.length > 0 ? html`
              <h4>Latest Post: ${posts[0].title}</h4>
              <p>Comments: ${latestPostComments.length}</p>
            ` : ''}
          ` : ''}
        `;
      }
    }
  );
</script>

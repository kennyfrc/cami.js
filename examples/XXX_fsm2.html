<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Shell</title>
</head>
<body style="box-sizing: content-box; margin-inline: auto; max-inline-size: 60vw; margin-top: 10vh;">
  <article>
  <h1>Traffic Light Simulator</h1>
  <traffic-light-component></traffic-light-component>
</article>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<script src="./build/cami.cdn.js"></script>
<script type="module">
  const { html, ReactiveElement, model } = cami;
  cami.debug.enable();

  const TrafficLightModel = model("TrafficLight", {
    store: "traffic-light-store-fsm2",
    state: {
      mainLight: 'red',
      pedestrianSignal: 'walk'
    },
  });

  TrafficLightModel.register({
    machine: {
      change: {
        from: [
          { mainLight: 'red', pedestrianSignal: 'walk' },
          { mainLight: 'green', pedestrianSignal: 'stop' },
          { mainLight: 'yellow', pedestrianSignal: 'stop' }
        ],
        to: ({ state }) => {
          const transitions = {
            red: { mainLight: 'green', pedestrianSignal: 'stop' },
            green: { mainLight: 'yellow', pedestrianSignal: 'stop' },
            yellow: { mainLight: 'red', pedestrianSignal: 'walk' }
          };
          return transitions[state.mainLight];
        },
        onEntry: (ctx) => {
          console.log(`Entered state ${ctx.state.mainLight}`);
        },
        onTransition: (ctx) => {
          console.log(`Transitioned from ${ctx.from.mainLight} to ${ctx.to.mainLight}`);
        },
        onExit: (ctx) => {
          console.log(`Exited state ${ctx.state.mainLight}`);
        }
      },
      emergency: {
        from: [
          { mainLight: 'green', pedestrianSignal: 'stop' },
          { mainLight: 'yellow', pedestrianSignal: 'stop' }
        ],
        to: { mainLight: 'red', pedestrianSignal: 'walk' },
        guard: ({ payload }) => payload && payload.isEmergency
      }
    }
  });

  class TrafficLightElement extends ReactiveElement {
    onCreate() {
      setInterval(() => {
        TrafficLightModel.trigger('change');
      }, 2000);
    }

    template() {
      const { mainLight, pedestrianSignal, trigger } = TrafficLightModel;

      return html`
        <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
          <div style="width: 100px; height: 100px; border-radius: 50%; background-color: ${mainLight};"></div>
          <p>Current light: ${mainLight}</p>
          <p>Pedestrian signal: ${pedestrianSignal}</p>
          <button @click=${() => trigger('change')}>Force Change</button>
          <button @click=${() => trigger('emergency', { isEmergency: true })}>Emergency Stop</button>
        </div>
      `;
    }
  }

  customElements.define('traffic-light-component', TrafficLightElement);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application Shell</title>
  </head>
  <body
    style="
      box-sizing: content-box;
      margin-inline: auto;
      max-inline-size: 60vw;
      margin-top: 10vh;
    "
  >
<article>
  <h1>Registration Form</h1>
  <form-component></form-component>
</article>
<small>
  <p>
    Try entering an email that is already taken, such as
    trevinowanda@example.net (mock email)
  </p>
</small>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
/>
<script src="./build/cami.cdn.js"></script>
<!-- CDN version below -->
<!-- <script src="https://unpkg.com/cami@latest/build/cami.cdn.js"></script> -->
<script type="module">
  const { html, ReactiveElement, model } = cami;

  const FormModel = model("FormModel", {
    store: "form-store",
    state: {
      email: "",
      password: "",
      emailError: "",
      passwordError: "",
      emailIsValid: null,
      isEmailAvailable: null,
    },
    actions: {
      setEmail: ({ state, payload }) => {
        state.email = payload;
      },
      setPassword: ({ state, payload }) => {
        state.password = payload;
      },
      setEmailError: ({ state, payload }) => {
        state.emailError = payload;
      },
      setPasswordError: ({ state, payload }) => {
        state.passwordError = payload;
      },
      setEmailIsValid: ({ state, payload }) => {
        state.emailIsValid = payload;
      },
      setIsEmailAvailable: ({ state, payload }) => {
        state.isEmailAvailable = payload;
        // debugger;
      },
    },
    queries: {
      queryEmail: {
        queryKey: (email) => ["Email", email],
        queryFn: (email) => {
          return fetch(`https://api.camijs.com/users?email=${email}`).then(
            (res) => res.json()
          );
        },
        onSuccess: ({ state, payload, actions, response }) => {
          if (response.length > 0) {
            actions.setIsEmailAvailable(false);
          } else {
            actions.setIsEmailAvailable(true);
          }
        },
        staleTime: 1000 * 60 * 5,
      },
    },
  });

  class FormElement extends ReactiveElement {
    processEmailInput(e) {
      const { isEmailValid, emailError, email } = this.validateEmail(
        e.target.value
      );
      FormModel.setEmailError(emailError);
      FormModel.setEmailIsValid(isEmailValid);
      FormModel.setEmail(email);
      FormModel.queryEmail(email);
    }

    processPasswordInput(e) {
      const { isValid, password } = this.validatePassword(e.target.value);
      FormModel.setPasswordError(
        isValid ? "" : "Password must be at least 8 characters long."
      );
      FormModel.setPassword(password);
    }

    validateEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      let emailError = "";
      let isEmailValid = null;
      if (email === "") {
        emailError = "";
        isEmailValid = null;
      } else if (!emailRegex.test(email)) {
        emailError = "Please enter a valid email address.";
        isEmailValid = false;
      } else {
        emailError = "";
        isEmailValid = true;
      }
      return { isEmailValid, emailError, email };
    }

    validatePassword(password) {
      let isValid = false;
      if (password === "") {
        isValid = null;
      } else if (password?.length >= 8) {
        isValid = true;
      }
      return { isValid, password };
    }

    getEmailInputState() {
      if (FormModel.email === "") {
        return "";
      } else if (
        FormModel.emailIsValid &&
        FormModel.isEmailAvailable === true
      ) {
        return false;
      } else {
        return true;
      }
    }

    getPasswordInputState() {
      if (FormModel.password === "") {
        return "";
      } else if (FormModel.passwordError === "") {
        return false;
      } else {
        return true;
      }
    }

    template() {
      return html`
        <form action="/submit" method="POST">
          <label>
            Email:
            <input
              type="email"
              aria-invalid=${this.getEmailInputState()}
              @input=${(e) => this.processEmailInput(e)}
              value=${FormModel.email}
            />
            <span
              >${FormModel.isEmailAvailable === false &&
              FormModel.emailError === ""
                ? "Email is already taken."
                : ""}</span
            >
            <span>${FormModel.emailError}</span>
          </label>
          <label>
            Password:
            <input
              type="password"
              @input=${(e) => this.processPasswordInput(e)}
              value=${FormModel.password}
              aria-invalid=${this.getPasswordInputState()}
            />
            <span>${FormModel.passwordError}</span>
          </label>
          <input
            type="submit"
            value="Submit"
            style="opacity: ${FormModel.emailError !== "" ||
            FormModel.passwordError !== "" ||
            FormModel.email === "" ||
            FormModel.password === ""
              ? "0.5"
              : "1"}"
          />
        </form>
      `;
    }
  }

  customElements.define("form-component", FormElement);
</script>
  </body>
</html>

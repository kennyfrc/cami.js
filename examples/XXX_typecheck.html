<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application Shell</title>
  </head>
  <body
    style="
      box-sizing: content-box;
      margin-inline: auto;
      max-inline-size: 60vw;
      margin-top: 10vh;
    "
  >
<article>
  <h1>Type Change Test</h1>
  <p><small class="note"></small></p>
  <type-change-component></type-change-component>
</article>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
<script src="./build/cami.cdn.js"></script>
<script type="module">
  const { html, ReactiveElement, slice } = cami;
  cami.debug.enable();

  // Create a slice for type change test
  const TypeChangeSlice = slice("TypeChangeSlice", {
    store: "type-change-store",
    state: {
      nullableValue: null,
      undefinedValue: undefined,
      status: 'initial'
    },
    actions: {
      changeNullableType: ({ state, payload }) => {
        state.nullableValue = payload;
      },
      changeUndefinedType: ({ state, payload }) => {
        state.undefinedValue = payload;
      },
      setStatus: ({ state, payload }) => {
        state.status = payload;
      }
    }
  });

  // Define the custom element
  class TypeChangeElement extends ReactiveElement {
    template() {
      return html`
        <p>Nullable value: ${TypeChangeSlice.nullableValue === null ? 'null' : TypeChangeSlice.nullableValue}</p>
        <p>Undefined value: ${TypeChangeSlice.undefinedValue === undefined ? 'undefined' : TypeChangeSlice.undefinedValue}</p>
        <p>Status: ${TypeChangeSlice.status}</p>
        <button @click=${() => TypeChangeSlice.changeNullableType('string value')}>Change Nullable to String</button>
        <button @click=${() => TypeChangeSlice.changeNullableType(42)}>Change Nullable to Number</button>
        <button @click=${() => TypeChangeSlice.changeNullableType(null)}>Change Nullable to Null</button>
        <button @click=${() => TypeChangeSlice.changeUndefinedType('string value')}>Change Undefined to String</button>
        <button @click=${() => TypeChangeSlice.changeUndefinedType(42)}>Change Undefined to Number</button>
        <button @click=${() => TypeChangeSlice.changeUndefinedType(undefined)}>Change Undefined to Undefined</button>
        <button @click=${() => {
          try {
            TypeChangeSlice.changeNullableType({ key: 'value' });
            TypeChangeSlice.setStatus('Changed to object successfully');
          } catch (error) {
            TypeChangeSlice.setStatus(`Error: ${error.message}`);
          }
        }}>Try Change Nullable to Object</button>
      `;
    }
  }

  customElements.define('type-change-component', TypeChangeElement);
</script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Shell</title>
</head>
<body style="box-sizing: content-box; margin-inline: auto; max-inline-size: 60vw; margin-top: 10vh;">
<main class="container">
  <h1>Navigation State Machine</h1>
  <div id="app">
    <button id="toggleNav">Toggle Navigation</button>
    <button id="invalidateNav">Invalidate Navigation</button>
    <p>Current Navigation Status: <span id="navStatus"></span></p>
    <p id="errorMessage" style="color: red;"></p>
  </div>
</main>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
<script src="./build/cami.cdn.js"></script>
<script type="module">
  const { store, effect } = cami;
  cami.debug.enable()

  const appStore = store({
    state: {
      navigation: {
        status: 'menu'
      }
    },
    name: 'navigation-store'
  });

  appStore.action('NAV_FSM:TOGGLE', ({ state }) => {
    const transitions = {
      'menu': 'settings',
      'settings': 'profile',
      'profile': 'menu'
    };

    console.log(state.navigation.status);

    state.navigation.status = transitions[state.navigation.status];
  });

  // Action that attempts to set an invalid type
  appStore.action('NAV_FSM:INVALIDATE', ({ state }) => {
    // This should trigger a type error because we're trying to set a number instead of a string
    state.navigation.status = 123;
  });

  effect(() => {
    console.log('Navigation status changed:', appStore.state.navigation.status);
    document.getElementById('navStatus').textContent = appStore.state.navigation.status;
  });

  document.getElementById('toggleNav').addEventListener('click', () => {
    try {
      appStore.dispatch('NAV_FSM:TOGGLE');
    } catch (error) {
      handleError(error);
    }
  });

  document.getElementById('invalidateNav').addEventListener('click', () => {
    try {
      appStore.dispatch('NAV_FSM:INVALIDATE');
    } catch (error) {
      handleError(error);
    }
  });

  function handleError(error) {
    console.error('Caught error:', error.message);
    document.getElementById('errorMessage').textContent = 'Error: ' + error.message;
    // Optionally, stop the interval to prevent further actions
    clearInterval(intervalId);
  }

  // Attempt to trigger the bug by rapidly changing the navigation status
  const intervalId = setInterval(() => {
    try {
      appStore.dispatch('NAV_FSM:TOGGLE');
    } catch (error) {
      handleError(error);
    }
  }, 1000);
</script>
</body>
</html>

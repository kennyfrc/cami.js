<body style="box-sizing: content-box; margin-inline: auto; max-inline-size: 60vw; margin-top: 10vh;">
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posts</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
</head>
<body>
  <main class="container">
    <h1>Posts</h1>
    <div id="posts-container">
      <!-- Posts will be rendered here -->
    </div>
  </main>

  <script src="./build/cami.cdn.js"></script>
  <script type="module">
    const { html, ReactiveElement, store } = cami;

    // Singleton pattern to ensure the store is only initialized once
    const appStore = store({
      posts: [],
      isLoading: false,
      error: null
    });

    // Define a single action to update the query state
    appStore.register('setQueryState', (state, payload) => {
      state.isLoading = payload.isLoading;
      state.posts = payload.posts;
      state.error = payload.error;
    });

    // Register a query to fetch posts
    appStore.query('posts/fetchAll', {
      queryKey: 'posts/fetchAll',
      queryFn: () => fetch('https://api.camijs.com/posts').then(res => res.json()),
      refetchOnWindowFocus: true,
      onStart: (actions) => {
        actions.setQueryState({ isLoading: true, posts: [], error: null });
      },
      onSuccess: (data, actions) => {
        actions.setQueryState({ isLoading: false, posts: data, error: null });
      },
      onError: (error, actions) => {
        actions.setQueryState({ isLoading: false, posts: [], error: error });
      }
    });

    // Fetch all posts
    appStore.fetch('posts/fetchAll');

    // Define a custom element to display the posts
    class PostsElement extends ReactiveElement {
      posts = [];
      isLoading = false;
      error = null;

      onConnect() {
        appStore.subscribe(state => {
          this.posts = state.posts;
          this.isLoading = state.isLoading;
          this.error = state.error;
        });
      }

      template() {
        if (this.isLoading) {
          return html`<p>Loading...</p>`;
        }

        if (this.error) {
          return html`<p>Error: ${this.error.message}</p>`;
        }

        return html`
          <ul>
            ${this.posts.map(post => html`<li>${post.title}</li>`)}
          </ul>
        `;
      }
    }

    customElements.define('posts-element', PostsElement);

    // Render the posts element
    document.getElementById('posts-container').appendChild(document.createElement('posts-element'));

    cami.debug.enable();

    console.log('App store initialized');
  </script>
</body>
</html>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Shell</title>
</head>
<body style="box-sizing: content-box; margin-inline: auto; max-inline-size: 60vw; margin-top: 10vh;">
<article>
  <h1>Todo List</h1>
  <p><small class="note"></small></p>
  <todo-list-component></todo-list-component>
</article>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
/>
<script src="./build/cami.cdn.js"></script>
<script type="module">
  const { html, ReactiveElement, Type } = cami;
  cami.debug.enable();

  const TodoModel = Type.Model("TodoModel", {
    newTodoTitle: Type.String,
    todos: Type.Product({
      data: Type.Array(
        Type.Product({
          id: Type.Integer,
          title: Type.String,
          completed: Type.Boolean,
        })
      ),
      status: Type.Enum("idle", "pending", "success", "error"),
      error: Type.Optional(Type.String),
    }),
  });

  const todoStore = TodoModel.create({
    state: {
      newTodoTitle: "",
      todos: {
        data: [],
        status: "idle",
        error: null,
      },
    },
    actions: {
      setTodos: ({ state, payload }) => {
        const { data, status, error } = payload;
        state.todos = {
          data: data.map((todo, index) => ({
            id: todo.id ?? Date.now() + index,
            title: todo.title,
            completed: todo.completed || false,
          })),
          status,
          error,
        };
      },
      addTodo: ({ state, payload }) => {
        state.todos.data.push({
          id: payload.id,
          title: payload.title,
          completed: payload.completed || false,
        });
      },
      removeTodo: ({ state, payload }) => {
        state.todos.data = state.todos.data.filter(
          (todo) => todo.id !== payload.id
        );
      },
      setNewTodoTitle: ({ state, payload }) => {
        state.newTodoTitle = payload;
      },
    },
    queries: {
      fetchTodos: {
        queryKey: ["todos"],
        queryFn: () =>
          fetch("https://api.camijs.com/todos?_limit=5").then((res) =>
            res.json()
          ),
        staleTime: 1000 * 60 * 5,
        onFetch: ({ dispatch }) => {
          dispatch("setTodos", { data: [], status: "pending", error: null });
        },
        onSuccess: ({ dispatch, data }) => {
          dispatch("setTodos", {
            data: data.map((todo) => ({
              id: todo.id,
              title: todo.title,
              completed: todo.completed || false,
            })),
            status: "success",
            error: null,
          });
        },
        onError: ({ dispatch, error }) => {
          dispatch("setTodos", {
            data: [],
            status: "error",
            error: error.message,
          });
        },
      },
    },
    mutations: {
      createTodo: {
        mutationFn: (newTodo) => {
          return fetch("https://api.camijs.com/todos", {
            method: "POST",
            body: JSON.stringify(newTodo),
            headers: { "Content-type": "application/json; charset=UTF-8" },
          }).then((res) => res.json());
        },
        onMutate: ({ dispatch, payload }) => {
          const newTodo = {
            id: Date.now(),
            title: payload.title,
            completed: payload.completed || false,
          };
          dispatch("addTodo", newTodo);
          document.querySelector(".note").innerHTML =
            "Todo added optimistically. Note that since we're using a mock server, this doesn't modify anything in the DB.";
        },
        onSuccess: ({ invalidateQueries }) => {
          invalidateQueries({ queryKey: ["todos"] });
        },
      },
      deleteTodo: {
        mutationFn: (todo) => {
          return fetch(`https://api.camijs.com/todos/${todo.id}`, {
            method: "DELETE",
          }).then((res) => res.json());
        },
        onMutate: ({ dispatch, payload }) => {
          dispatch("removeTodo", payload);
          document.querySelector(".note").innerHTML =
            "Todo deleted optimistically. Note that since we're using a mock server, this doesn't modify anything in the DB.";
        },
        onSuccess: ({ invalidateQueries }) => {
          invalidateQueries({ queryKey: ["todos"] });
        },
      },
    },
  });

  class TodoListElement extends ReactiveElement {
    template() {
      const { todos, newTodoTitle } = todoStore;
      const { mutate, dispatch } = todoStore;

      if (todos.status === "success") {
        return html`
          <input
            type="text"
            .value=${newTodoTitle}
            @input=${(e) => dispatch("setNewTodoTitle", e.target.value)}
          />
          <button
            @click=${() => {
              if (newTodoTitle.trim()) {
                mutate("createTodo", {
                  title: newTodoTitle.trim(),
                  completed: false,
                });
                dispatch("setNewTodoTitle", "");
              }
            }}
          >
            Add
          </button>
          <ul>
            ${todos.data
              .slice()
              .reverse()
              .map(
                (todo) => html`
                  <li>
                    ${todo.title}
                    <button @click=${() => mutate("deleteTodo", todo)}>
                      Delete
                    </button>
                  </li>
                `
              )}
          </ul>
        `;
      }

      if (todos.status === "pending") {
        return html`<div>Loading...</div>`;
      }

      if (todos.status === "error") {
        return html`<div>Error: ${todos.error}</div>`;
      }
    }
  }

  todoStore.query("fetchTodos");

  customElements.define("todo-list-component", TodoListElement);
</script>
</body>
</html>

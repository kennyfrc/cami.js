<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Shell</title>
</head>
<body style="box-sizing: content-box; margin-inline: auto; max-inline-size: 60vw; margin-top: 10vh;">
<article>
  <h1>Async User Fetcher</h1>
  <user-fetcher-component></user-fetcher-component>
</article>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<script src="./build/cami.cdn.js"></script>
<script type="module">
  const { html, ReactiveElement, store } = cami;
  cami.debug.enable();

  const userStore = store({
    state: {
      user: null,
      loading: false,
      error: null
    },
    name: "user-store"
  });

  userStore.defineAction('setUser', ({ state, payload }) => {
    state.user = payload;
  });

  userStore.defineAction('setLoading', ({ state, payload }) => {
    state.loading = payload;
  });

  userStore.defineAction('setError', ({ state, payload }) => {
    state.error = payload;
  });

  // Define an async action
  const fetchUser = (userId) => async (dispatch, getState) => {
    try {
      dispatch('setLoading', true);
      dispatch('setError', null);
      const response = await fetch(`https://jsonplaceholder.typicode.com/users/${userId}`);

      if (!response.ok) {
        throw new Error('Failed to fetch user');
      }
      const user = await response.json();
      dispatch('setUser', user);
    } catch (error) {
      dispatch('setError', error.message);
    } finally {
      dispatch('setLoading', false);
    }
  };

  customElements.define('user-fetcher-component',
    class extends ReactiveElement {
      userId = 1;

      template() {
        const { user, loading, error } = userStore.state;
        const { dispatch } = userStore;

        const handleFetch = () => {
          dispatch(fetchUser(this.userId));
          this.userId = this.userId % 10 + 1; // Cycle through user IDs 1-10
        };

        return html`
          <button @click=${handleFetch} ?disabled=${loading}>
            ${loading ? 'Fetching...' : 'Fetch Next User'}
          </button>
          ${error ? html`<p style="color: red;">${error}</p>` : ''}
          ${user ? html`
            <h2>${user.name}</h2>
            <p>Email: ${user.email}</p>
            <p>Phone: ${user.phone}</p>
          ` : ''}
        `;
      }
    }
  );
</script>
</body>
</html>
